# DeskGhost configuration
# ─────────────────────────────────────────────────────────────────────────────
# Edit this file to tune behaviour, then:
#   macOS   → bash scripts/setup.sh install-source     (re-registers the LaunchAgent)
#   Windows → .\scripts\setup.ps1 install-source       (re-registers the Scheduled Task)
#
# Scheduler triggers are derived from the effective schedule (base days,
# per-day overrides, and optional timezone) and converted to local OS time
# when you run the install scripts.
#
# Optional: set schedule.timezone to evaluate work/lunch windows in another
# region using an IANA timezone name (for example, America/Bogota).
# ─────────────────────────────────────────────────────────────────────────────

nudge:
    # How long the user must be idle (seconds) before nudging starts.
    idle_time_seconds: 90

    # Seconds between consecutive nudges while the user remains idle.
    move_interval_seconds: 5

schedule:
    # HH:MM — base start of the work window.
    work_start: "07:30"

    # HH:MM — base end of the work window.
    work_end: "17:00"

    # Base active weekdays. 0 = Monday ... 6 = Sunday.
    work_days: [0, 1, 2, 3, 4]

    # Optional named timezone used for schedule/lunch checks.
    # If omitted, DeskGhost uses the machine local timezone.
    timezone: "America/Bogota"

    # Optional per-day overrides.
    # - enabled: false disables a day even if listed in work_days.
    # - enabled: true enables a day even if NOT listed in work_days.
    # - work_start/work_end override only that day's window.
    day_overrides:
        4: # Friday
            work_end: "16:00"

lunch:
    # HH:MM — start of the lunch break (bot nudges silently during this window).
    start: "13:00"

    # Length of the lunch break in minutes.
    duration_minutes: 60
