name: Build And Release Artifacts

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

  build-package:
    name: Build and package (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact_path: build/release/macos/*.zip
          - os: windows-latest
            platform: windows
            artifact_path: build/release/windows/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: bash scripts/setup.sh build

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: bash scripts/setup.sh package

      - name: Install Dependency Walker (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $url = "https://dependencywalker.com/depends22_x64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "depends22_x64.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "depends22_x64"

          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

          $depends = Get-ChildItem -Path $extractDir -Filter "depends.exe" -Recurse | Select-Object -First 1
          if (-not $depends) {
            Write-Error "Dependency Walker download succeeded but depends.exe was not found."
            Get-ChildItem -Path $extractDir -Recurse | Select-Object FullName
            exit 1
          }

          $depends.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\setup.ps1 build

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\setup.ps1 package

      - name: Verify package output
        shell: bash
        run: |
          shopt -s nullglob
          files=( ${{ matrix.artifact_path }} )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No packaged artifacts were produced for ${{ matrix.platform }}"
            exit 1
          fi
          printf '%s\n' "${files[@]}"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deskghost-${{ matrix.platform }}-release
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

