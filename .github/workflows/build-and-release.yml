name: Build And Release Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

  build-package:
    name: Build and package (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact_path: build/release/macos/*.zip
          - os: windows-latest
            platform: windows
            artifact_path: build/release/windows/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: bash scripts/setup.sh build

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: bash scripts/setup.sh package

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\setup.ps1 build

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\setup.ps1 package

      - name: Verify package output
        shell: bash
        run: |
          shopt -s nullglob
          files=( ${{ matrix.artifact_path }} )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No packaged artifacts were produced for ${{ matrix.platform }}"
            exit 1
          fi
          printf '%s\n' "${files[@]}"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deskghost-${{ matrix.platform }}-release
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: build-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List downloaded files
        shell: bash
        run: find dist -type f | sort

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.zip
